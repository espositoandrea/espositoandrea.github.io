# Pages has a single deployment per site, so the "redesign" branch is staged as a subpath of the production site
# (https://espositoandrea.github.io/redesign/). Every run builds both branches and deploys them together:
# pushing either branch refreshes both, so one never wipes out the other.
name: Build and Deploy Jekyll
on:
  push:
    branches:
      - main
      - redesign
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: main
            ref: main
            subpath: ""
          - name: redesign
            ref: redesign
            subpath: /redesign
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ matrix.ref }}
          submodules: true

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4' # Not needed with a .ruby-version file
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
          cache-version: 0 # Increment this number if you need to re-download cached gems

      # Bootstrap is compiled from source by Jekyll (sass load path: node_modules)
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      # Open Graph images of the posts and the default one (see scripts/og-images.mjs)
      - name: Generate Open Graph images
        run: npm run og-images

      # Post PDFs (see the Makefile). Cached so that they are built once: the Makefile compares content
      # hashes (stored in _build/hash), so only posts whose source changed are rebuilt.
      - name: Restore cached post PDFs
        uses: actions/cache@v4
        with:
          path: |
            assets/posts/pdfs
            _build
          key: post-pdfs-v2-${{ matrix.name }}-${{ hashFiles('_posts/*.md', '_pandoc/**', 'Makefile') }}
          restore-keys: |
            post-pdfs-v2-${{ matrix.name }}-

      # Typst typesets the PDFs (no LaTeX needed); the fonts are downloaded by the Makefile
      - name: Install PDF tools
        run: |
          # the packaged pandoc is too old for the Typst writer
          curl -fsSL -o pandoc.deb https://github.com/jgm/pandoc/releases/download/3.12.1/pandoc-3.12.1-1-amd64.deb
          sudo dpkg -i pandoc.deb
          curl -fsSL https://github.com/typst/typst/releases/download/v0.15.1/typst-x86_64-unknown-linux-musl.tar.xz \
            | sudo tar -xJ --strip-components=1 -C /usr/local/bin typst-x86_64-unknown-linux-musl/typst

      - name: Build post PDFs
        run: make pdfs

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5.0.0

      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}${{ matrix.subpath }}"
        env:
          JEKYLL_ENV: production
          JEKYLL_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The staging copy must not be indexed
      - name: Mark staging as noindex
        if: matrix.name != 'main'
        run: |
          find _site -name '*.html' -exec sed -i 's|<head>|<head><meta name="robots" content="noindex, nofollow">|' {} +

      - name: Upload site
        uses: actions/upload-artifact@v4
        with:
          name: site-${{ matrix.name }}
          path: _site
          include-hidden-files: true

  # Merge the production site and the staging copy into a single Pages artifact
  assemble:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download sites
        uses: actions/download-artifact@v4
        with:
          path: sites

      - name: Merge
        run: |
          mkdir _site
          cp -a sites/site-main/. _site/
          mkdir _site/redesign
          cp -a sites/site-redesign/. _site/redesign/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: assemble
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
