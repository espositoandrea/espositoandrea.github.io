name: Build and Deploy Jekyll
on:
  push:
    branches:
      - main
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1.225.0
        with:
          ruby-version: '3.2' # Not needed with a .ruby-version file
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
          cache-version: 0 # Increment this number if you need to re-download cached gems

      # Post PDFs (see the Makefile). Cached so that they are built once: the Makefile compares content
      # hashes (stored in _build/hash), so only posts whose source changed are rebuilt.
      - name: Restore cached post PDFs
        uses: actions/cache@v4
        with:
          path: |
            assets/posts/pdfs
            _build
          key: post-pdfs-${{ hashFiles('_posts/*.md', '_pandoc/**', 'Makefile') }}
          restore-keys: |
            post-pdfs-

      - name: Install PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends groff poppler-utils python3-pil
          # the packaged pandoc is too old for the custom writers
          curl -fsSL -o pandoc.deb https://github.com/jgm/pandoc/releases/download/3.8/pandoc-3.8-1-amd64.deb
          sudo dpkg -i pandoc.deb

      - name: Build post PDFs
        run: make pdfs

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5.0.0

      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
          JEKYLL_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Upload artifact
        # Automatically uploads an artifact from the './_site' directory by default
        uses: actions/upload-pages-artifact@v3.0.1

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4.0.5
