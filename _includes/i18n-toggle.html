{%- comment -%}
  Switch between English translations (default) and original titles for every
  `.i18n-orig` / `.i18n-en` pair on the page (see i18n.html). The choice is remembered.
{%- endcomment -%}
<style>
    html[data-title-language="original"] .i18n-en,
    html:not([data-title-language="original"]) .i18n-orig { display: none; }
</style>
<div class="mb-4" id="i18n-toggle" hidden>
    <div class="d-flex flex-wrap align-items-center gap-2 small">
        <span class="text-body-secondary" id="i18n-toggle-label">Show:</span>
        <div class="btn-group btn-group-sm" role="group" aria-labelledby="i18n-toggle-label">
            <button type="button" class="btn btn-outline-secondary" data-title-language="en">English translations</button>
            <button type="button" class="btn btn-outline-secondary" data-title-language="original">Original titles</button>
        </div>
    </div>
</div>
<script>
    (function () {
        var KEY = "title-language";
        var root = document.documentElement;
        var toggle = document.getElementById("i18n-toggle");
        var buttons = toggle.querySelectorAll("button");

        function apply(mode) {
            root.setAttribute("data-title-language", mode);
            buttons.forEach(function (button) {
                var active = button.getAttribute("data-title-language") === mode;
                button.classList.toggle("active", active);
                button.setAttribute("aria-pressed", active);
            });
        }

        var saved = null;
        try { saved = localStorage.getItem(KEY); } catch (e) {}
        apply(saved === "original" ? "original" : "en");

        buttons.forEach(function (button) {
            button.addEventListener("click", function () {
                var mode = button.getAttribute("data-title-language");
                apply(mode);
                try { localStorage.setItem(KEY, mode); } catch (e) {}
            });
        });
        toggle.hidden = false;
    })();
</script>
