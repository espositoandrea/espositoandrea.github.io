<div class="badges no-blank-icon d-flex flex-row gap-3 align-items-center">
	<span
		class="altmetric-embed"
		{% if include.entry.doi %}
			data-doi="{{ include.entry.doi }}"
		{% elsif include.entry.url %}
			data-uri="{{ include.entry.url }}"
		{% endif %}
		data-badge-popover="bottom"></span>

	<span class="__dimensions_badge_embed__" data-doi="{{ include.entry.doi | default: 'nodoi' }}" data-style="small_rectangle"></span>
</div>
