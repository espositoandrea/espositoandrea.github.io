<nav class="navbar md:navbar-expand sticky-top" id="main-navigation">
    <div class="container">
        <a class="navbar-brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
        <button class="btn-icon navbar-toggler" type="button" data-bs-toggle="drawer" data-bs-target="#navbarDrawer"
            aria-controls="navbarDrawer" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon" aria-hidden="true"></span>
        </button>
        <dialog class="drawer drawer-end" tabindex="-1" id="navbarDrawer" aria-labelledby="navbarDrawerLabel">
            <div class="drawer-header">
                <h5 class="drawer-title" id="navbarDrawerLabel">Menu</h5>
                <button type="button" class="btn-close" data-bs-dismiss="drawer" aria-label="Close"></button>
            </div>
            <div class="drawer-body mb-2 md:mb-0">
                <ul class="nav navbar-nav me-auto md:ms-auto md:me-0">
                    {% for item in site.data.navigation %}
                        {% unless item.children %}
                        <li class="nav-item">
                            <a class="nav-link {% if page.url == item.url %} active {% endif %} {% if item.disabled %} disabled {% endif %}"
                               href="{{ item.url | absolute_url }}"
                               {% if page.url == item.url %} aria-current="page" {% endif %}
                               {% if item.external %} target="_blank" rel="noopener noreferrer" {% endif %}
                               {% if item.disabled %} aria-disabled="true" {% endif %}>
                                {{ item.title }}
                            </a>
                        </li>
                        {% else %}
                        <li class="nav-item">
                            <button class="nav-link" type="button" data-bs-toggle="menu" aria-expanded="false">
                                {{ item.title }}
                            </button>
                            <div class="menu">
                                {% for child in item.children %}
                                <a class="menu-item" href="{{ child.url | absolute_url }}">{{ child.title }}</a>
                                {% endfor %}
                            </div>
                        </li>
                        {% endunless %}
                    {% endfor %}
                </ul>
            </div>
        </dialog>
    </div>
</nav>
