  title: Rhino-Cyt
  link: https://doi.org/10.1016/j.artmed.2024.102933
  description: >-
    A human-centered symbiotic AI platform that aids physicians in conducting a rhinocytological exam. The system provides classification explanations, confidence rating for each classified cells, and allows for interventions to edit the AI's output.
  description_it: >-
    Una piattaforma di intelligenza artificiale simbiotica centrata sull’uomo che assiste i medici nell’esecuzione di un esame rinocitologico. Il sistema fornisce spiegazioni sulla classificazione, una valutazione di fiducia per ciascuna cellula classificata e permette interventi per modificare l’output dell’IA.
