- start: 2020-03-26
  end: null
  title: SERENE
  link: https://github.com/uxsad
  description: >-
    A web platform (formerly UXSAD) for the semi-automatic evaluation of usability and UX issues in websites. It provides usability experts with the ability to generate a library for collecting interaction data within websites. This data is then automatically analyzed by a custom artificial intelligence model to perform emotional analysis. Implemented in Laravel and Python. Source code available in various repositories published on the project’s GitHub profile.
  description_it: >-
    Una piattaforma web (ex UXSAD) per la valutazione semi-automatica di
    problemi di usabilità e UX nei siti web. Fornisce la possibilità agli
    esperti di usabilità di generare una libreria per la raccolta di dati
    di interazione all'interno di siti web. Tali dati sono poi
    automaticamente analizzati da un modello di intelligenza artificiale
    personalizzato per effettuare analisi emotiva. Implementato in Laravel
    e Python. Codice sorgente disponibile su diverse repository pubblicate
    sul profilo GitHub del progetto.
