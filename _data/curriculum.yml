    thesis: "A Human–AI Interaction Model: Leveraging Human-Centred Design for Symbiotic AI"
    supervisors:
      - name: Prof. Giuseppe Desolda
        role: supervisor
      - name: Prof. Rosa Lanzilotti
        role: co-supervisor
    evaluation: Awarded cum laude.
    evaluation_it: Con lode.
    notes: |-
        PhD research in Human-Centered Artificial Intelligence at the
        intersection of Human–Computer Interaction and Artificial Intelligence.
        His work focuses on the design of human–AI interaction models that
        enable effective collaboration between humans and intelligent systems.

        The research contributes to the conceptual and methodological
        foundations of Symbiotic AI, investigating how AI systems can support
        human decision-making through transparent, explainable, and trustworthy
        interaction mechanisms.

        The thesis proposes a model for human–AI interaction grounded in
        human-centered design principles, including the formalization and
        evaluation of trust in AI systems through user studies across multiple
        application domains.

        Visiting research periods at Ludwig Maximilian University of Munich (6
        months) and at Eusoft S.r.l. (6 months).

        Winner of a fully-funded Ph.D. fellowship within the framework of the Italian
        "[D.M. n. 352, April 9, 2022](https://www.mur.gov.it/it/atti-e-normativa/decreto-ministeriale-n352-del-09-04-2022)"
        - under the National Recovery and Resilience
