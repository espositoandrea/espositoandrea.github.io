brief: |
  Andrea Esposito is a postdoctoral researcher at [Inria]{:target="_blank"},
  in the [Wimmics]{:target="_blank"} team at
  [Université Côte d'Azur]{:target="_blank"},
  working on Human-Centered AI and Symbiotic AI at the
  intersection of Human-Computer Interaction and Artificial Intelligence.
  
  He holds a PhD (cum laude) in Computer Science and Mathematics from the
  [University of Bari Aldo Moro]{:target="_blank"}. His doctoral research,
  conducted as part of the [IVU Laboratory]{:target="_blank"} at the
  [Department of Computer Science]{:target="_blank"} of the University of Bari,
  focuses on human-AI interaction models built on
  transparency, explainability, and trust, with applications in healthcare, 
  accessibility, and cybersecurity.
  His PhD thesis has been [published by Springer](https://link.springer.com/book/9783658526313){:target="_blank"}.
  
  At Inria, he works on the [MetaboLinkAI]{:target="_blank"} project, developing LLM-based
  conversational assistants for exploring metabolomics knowledge graphs.
  
  He has been a visiting researcher at
  [Ludwig-Maximilians Universität (LMU)]{:target="_blank"} in Munich
  and [Eusoft S.r.l.]{:target="_blank"}, as well as a project secondee for the
  [GenDAI]{:target="_blank"} project at [InConTec GmbH]{:target="_blank"}.
  He also collaborates with the European Network of Human-Centered Artificial
  Intelligence [Humane-AI]{:target="_blank"}.
  He serves as a reviewer and program committee member for major HCI and AI venues.

  He is an active member of the [IFIP TC13 WG 13.11/12.14]{:target="_blank"}
  joint working group on *Human-Centered Intelligent Interactive Systems*.

