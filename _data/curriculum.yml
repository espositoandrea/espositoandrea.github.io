      ISO-25000 mirato a coadiuvare la valutazione dell'usabilità di siti web
      seguendo il protocollo eGLU (un framework e standard per i test di
      usabilità). I compiti principali riguardano:

      * la progettazione, implementazione e documentazione di un
        "reverse proxy" da utilizzare in eGLU-Box utilizzando Laravel (PHP);
      * la valutazione (e il refactoring) di varie componenti del sistema.

      Durante questo periodo, diverse attività di ricerca sono state avviate e
      stanno portando alla pubblicazione di vari articoli.
