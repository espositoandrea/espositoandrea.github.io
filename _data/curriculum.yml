# Current position, as shown in the Italian CV for public evaluations
current_position_it: |-
  Ricercatore postdoc presso il Centre Inria d'Université Côte d'Azur, team Wimmics (Sophia Antipolis, Francia), dal 1 ottobre 2026, nell'ambito del progetto *MetaboLinkAI*.

  Dottore di Ricerca in Informatica e Matematica (con lode) presso l'Università degli Studi di Bari "Aldo Moro", con discussione finale della tesi il 25 febbraio 2026 (settore INFO-01/A). Vincitore di una borsa di Dottorato regolamentata "D.M. n. 352 del 9 aprile 2022" - Piano Nazionale di Ripresa e Resilienza (PNRR), Missione 4, Componente 2, Investimento 3.3 - Progetto "Human-Centered Artificial Intelligence (HCAI) techniques for supporting end users interacting with AI systems", co-finanziato da "Eusoft S.r.l." (CUP H91I22000410007).

  Dal 1 ottobre 2024 al 30 settembre 2026 titolare di un Assegno di Ricerca (tipo B), P.R. 01.115, nell'ambito del progetto *PROTECT - imPROving ciTizEn inClusivity Through Conversational AI*. Settore scientifico disciplinare: INFO-01/A IINF-05/A.

  È membro del Laboratorio Interaction, Visualization, Usability & UX (IVU Lab), coordinato dalla Prof.ssa Rosa Lanzilotti. Cultore della materia in tre insegnamenti (interazione uomo-macchina, programmazione per il web, interaction with intelligent systems).
