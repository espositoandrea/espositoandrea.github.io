    notes: >-
        Obtained the Master's Degree, in English, in "Computer Science" at the
        University of Bari "A. Moro". His thesis, titled "Design And Development of a Human-Centred Conversational Agent for 3D Modelling", was developed under the
        supervision of the [IVU Laboratory](http://ivu.di.uniba.it) of the
        University of as part of a
        [micro-project](https://www.humane-ai.eu/project/making-for-everyone-interactive-voice-based-support-for-the-design-of-3d-objects-for-digital-fabrication/)
        of WP3 of the [Humane-AI](http://www.humane-ai.eu) network, and for this
        reason he was a visitor for one month at the
        [Human-Centered Ubiquitous Media](https://www.en.um.informatik.uni-muenchen.de/index.html) research group of the
        [Ludwig-Maximilians-Universität](https://www.lmu.de/) in Munich,
        Germany.


        The thesis focused on exploring the way lay users approach the task of
        3D modelling with the support of an AI agent. It discusses a Wizard of
        Oz user study and provides an initial implementation of an AI system
        that adopts the users' mental model of the task, providing an example
        of HCAI system.
    notes_it: |-
        La tesi è incentrata sull'esplorazione del modello mentale di utenti
        non esperti nel task della modellazione 3D, con il supporto di un
        agente intelligente basato su AI. La tesi discute uno studio con utenti
        Wizard of Oz e fornisce una implementazione iniziale di un sistema
        basato su AI che adotta il modello mentale degli utenti per il task,
        fornendo quindi un esempio di sistema HCAI.
