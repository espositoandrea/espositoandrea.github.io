        thesis was focused on the intersection of Affective Computing and HCI
        and presented a first attempt at automating usability testing and
        UX-smells detection through the use of an intelligent system. It led to
        multiple publications.
    notes_it: |-
        La tesi è incentrata sull'intersezione dell'Affective Computing e della
        HCI e presenta un primo tentativo di automatizzare i test di usabilità
        e il rilevamento di UX-smell attraverso l'uso di un sistema
        intelligente.
