# Italian version of `brief` (used by the Italian CV)
brief_it: |
  Andrea Esposito è ricercatore postdoc presso [Inria]{:target="_blank"}, nel
  team [Wimmics]{:target="_blank"} dell'[Université Côte d'Azur]{:target="_blank"},
  dove si occupa di Human-Centered AI e Symbiotic AI all'intersezione tra
  Human-Computer Interaction e Intelligenza Artificiale.

  È dottore di ricerca (con lode) in Informatica e Matematica presso
  l'[Università degli Studi di Bari Aldo Moro]{:target="_blank"}. La sua ricerca
  dottorale, svolta nel [Laboratorio IVU]{:target="_blank"} del
  [Dipartimento di Informatica]{:target="_blank"} dell'Università di Bari, si è
  concentrata su modelli di interazione uomo-IA basati su trasparenza,
  spiegabilità e fiducia, con applicazioni in ambito sanitario, accessibilità
  e cybersecurity. La tesi di dottorato è stata
  [pubblicata da Springer](https://link.springer.com/book/9783658526313){:target="_blank"}.

  Presso Inria lavora al progetto [MetaboLinkAI]{:target="_blank"}, sviluppando
  assistenti conversazionali basati su LLM per l'esplorazione di knowledge
  graph di metabolomica.

  Nell'ambito del dottorato ha trascorso sei mesi come ricercatore in visita
  presso la [Ludwig-Maximilians Universität (LMU)]{:target="_blank"} di Monaco
  e sei mesi presso [Eusoft S.r.l.]{:target="_blank"}, ed è stato project
  secondee per il progetto [GenDAI]{:target="_blank"} presso
  [InConTec GmbH]{:target="_blank"}. Collabora inoltre con la rete europea di
  Human-Centered Artificial Intelligence [Humane-AI]{:target="_blank"}. È
  revisore e membro di comitati di programma per importanti sedi di HCI e AI.

  È membro attivo del gruppo di lavoro congiunto
  [IFIP TC13 WG 13.11/12.14]{:target="_blank"} su *Human-Centered Intelligent
  Interactive Systems*.

  Andrea si impegna a far progredire il campo della Human-Centred AI,
  lavorando per migliorare l'interazione tra esseri umani e sistemi
  intelligenti.

