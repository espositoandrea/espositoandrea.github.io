---
---

<div>
	<div>
		{{ reference }}
	</div>

	<div class="bib-actions">
		{% for item in access %}
			<a class="no-blank-icon d-inline-flex align-items-center gap-1 text-decoration-none" href="{{ item.url }}" target="_blank" rel="noopener noreferrer" title="{{ item.description }}">
				<span class="{{ item.icon }}" aria-hidden="true"></span> {{ item.label }}
			</a>
		{% endfor %}
		{% include altmetric-badge.html entry=entry %}
		{%- capture more_details_link -%}{% details_link key %}{%- endcapture -%}
		<a href="{{ more_details_link | absolute_url }}" class="ms-auto"><i class="fa-solid fa-circle-info fa-fw" aria-hidden="true"></i> Details</a>
	</div>
</div>
