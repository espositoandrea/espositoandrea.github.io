---
layout: base
---

<section class="shell error-page">
    <p class="kicker"><span class="kicker-num">Error {{ page.error.code }}</span></p>
    <h1 class="error-code">{{ page.error.code }}</h1>
    <div class="page-lede">{{ page.error.message | markdownify }}</div>
    <div class="rich-text">{{ page.error.description | markdownify }}</div>
    <nav class="error-links" aria-label="Where to go next">
        <a class="btn-line is-accent" href="{{ '/' | relative_url }}">Home page</a>
        {%- include nav-items.html %}
        {%- for item in nav_items %}
        <a class="btn-line" href="{{ item.url | relative_url }}">{{ item.title }}</a>
        {%- endfor %}
    </nav>
</section>
